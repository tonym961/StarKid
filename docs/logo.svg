<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="StarKid">
  <title>StarKid</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#1F2A63"/>
      <stop offset="1" stop-color="#070B1E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE57F"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#FF7043"/>
    </linearGradient>
  </defs>

  <rect width="960" height="280" rx="40" fill="url(#sky)"/>

  <!-- cielo stellato -->
  <g fill="#FFFFFF">
    <circle cx="62" cy="48" r="2.6" opacity="0.85"/>
    <circle cx="128" cy="236" r="2" opacity="0.6"/>
    <circle cx="246" cy="62" r="1.8" opacity="0.7"/>
    <circle cx="300" cy="212" r="2.4" opacity="0.5"/>
    <circle cx="412" cy="44" r="1.8" opacity="0.6"/>
    <circle cx="520" cy="238" r="2.2" opacity="0.5"/>
    <circle cx="636" cy="52" r="2" opacity="0.65"/>
    <circle cx="742" cy="226" r="1.8" opacity="0.5"/>
    <circle cx="828" cy="70" r="2.6" opacity="0.8"/>
    <circle cx="902" cy="190" r="2" opacity="0.6"/>
    <circle cx="880" cy="112" r="1.6" opacity="0.45"/>
    <circle cx="690" cy="150" r="1.6" opacity="0.4"/>
  </g>

  <!-- la stella -->
  <path fill="url(#gold)"
        d="M150 78 L166.2 127.8 L218.5 127.8 L176.2 158.5 L192.3 208.2
           L150 177.5 L107.7 208.2 L123.8 158.5 L81.5 127.8 L133.8 127.8 Z"/>

  <!-- il razzo, in volo verso l'alto a destra -->
  <g transform="translate(222 92) rotate(38)">
    <path fill="#FFFFFF"
          d="M0 -34 C9 -21 13 -6 13 8 L13 22 L-13 22 L-13 8 C-13 -6 -9 -21 0 -34 Z"/>
    <path fill="#E53935" d="M0 -34 C6 -26 10 -16 11 -8 L-11 -8 C-10 -16 -6 -26 0 -34 Z"/>
    <path fill="#E53935" d="M13 8 L25 28 L13 22 Z"/>
    <path fill="#E53935" d="M-13 8 L-25 28 L-13 22 Z"/>
    <circle cx="0" cy="-2" r="6" fill="#1F2A63"/>
    <path fill="url(#flame)" d="M-7 22 L0 46 L7 22 Z"/>
  </g>

  <!-- marchio -->
  <text x="300" y="150" font-family="Verdana,DejaVu Sans,sans-serif" font-size="78" font-weight="bold" fill="#FFFFFF">Star</text>
  <text x="474" y="150" font-family="Verdana,DejaVu Sans,sans-serif" font-size="78" font-weight="bold" fill="#FFC846">Kid</text>
  <text x="302" y="196" font-family="Verdana,DejaVu Sans,sans-serif" font-size="27" fill="#B6C1E8">Launcher Android per bambini</text>
</svg>
