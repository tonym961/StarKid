# StarKid - vhost per starkid.antoninomiccio.com
# Destinazione: /etc/nginx/sites-available/starkid.antoninomiccio.com
#               piu un symlink in /etc/nginx/sites-enabled/
#
# ATTENZIONE: su questa macchina nginx serve dodici siti, tre dei quali fanno
# da proxy verso casa. Un errore qui li ferma tutti al primo reload.
# Si verifica SEMPRE con "nginx -t" prima di ricaricare, e si ricarica a mano.
#
# Le zone limit_req stanno qui in cima e non in conf.d/ perche
# /etc/nginx/sites-enabled/* viene incluso dentro il blocco http{} (layout
# Debian): e lo stesso contesto di conf.d/ratelimit.conf, quindi le direttive
# sono valide. Il vantaggio e che install.sh e uninstall.sh toccano un file
# solo. Se "nginx -t" risponde "directive is not allowed here", vuol dire che
# questa macchina include sites-enabled altrove: in quel caso si spostano le
# tre righe in /etc/nginx/conf.d/starkid-ratelimit.conf e nient'altro cambia.
#
# I nomi hanno tutti il prefisso starkid_ per non sovrapporsi alle zone di
# conf.d/ratelimit.conf: i nomi delle zone di memoria condivisa sono globali.

# API dei tablet e della web UI. Un tablet fa poche richieste al minuto:
# 10 al secondo e larghissimo e serve solo a tagliare gli abusi.
limit_req_zone $binary_remote_addr zone=starkid_api:1m   rate=10r/s;
# Accesso alla web UI: molto piu stretto, un genitore fa login una volta.
limit_req_zone $binary_remote_addr zone=starkid_login:1m rate=10r/m;
# Connessioni contemporanee per IP: tiene a terra la RAM dei worker nginx.
limit_conn_zone $binary_remote_addr zone=starkid_conn:1m;

# ---------------------------------------------------------------------------
# 80: solo ACME e rimando a 443
# ---------------------------------------------------------------------------
server {
    listen 80;
    # IPv6 lasciato commentato di proposito: se questa macchina non ha IPv6
    # attivo, "listen [::]:80" passa "nginx -t" ma fa fallire il bind al
    # reload, e quel reload tocca tutti e dodici i siti. Si attiva solo dopo
    # aver verificato con "ss -ltn" che gli altri vhost ascoltino su [::]:80.
    # listen [::]:80;
    server_name starkid.antoninomiccio.com;

    server_tokens off;
    access_log /var/log/starkid/access.log;
    error_log  /var/log/starkid/error.log warn;

    # --- ACME webroot: deve restare raggiungibile in chiaro e senza nessuna
    #     autenticazione, altrimenti il rinnovo del certificato fallisce. ---
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        allow all;
        default_type "text/plain";
        root /var/www/starkid.antoninomiccio.com/html;
        try_files $uri =404;
    }

    # In chiaro, senza credenziali e senza TLS da pagare, questa e la via piu
    # economica che esista verso l'interprete Python: ogni richiesta occupa un
    # thread e fa una query su SQLite. Su due vCPU condivisi con dodici siti,
    # senza freni si trascina giu anche gli altri. Quindi gli stessi limiti
    # della versione in https, e il log ACCESO: senza righe, fail2ban non
    # vede niente da bloccare.
    location = /healthz {
        auth_basic off;
        limit_req zone=starkid_api burst=5 nodelay;
        limit_conn starkid_conn 10;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:8082;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 443: il servizio
# ---------------------------------------------------------------------------
server {
    # Niente http2 qui, di proposito. In nginx 1.24 si accende col parametro
    # del listen, e i parametri di protocollo appartengono al SOCKET
    # 0.0.0.0:443, non al singolo vhost: il primo listen analizzato per quella
    # porta decide per tutti i server block che la condividono. Visto che
    # sites-enabled/ si legge in ordine alfabetico, scrivere "http2" qui
    # vorrebbe dire accenderlo a sorte su tutti e dodici i siti, compresi i
    # tre che proxano verso casa - e l'upgrade a WebSocket in HTTP/2 non
    # esiste, quindi quelli si romperebbero. Accendere HTTP/2 e una decisione
    # da prendere per l'intera macchina, non di sponda da un vhost nuovo.
    listen 443 ssl;
    # listen [::]:443 ssl;   # vedi la nota su IPv6 qui sopra
    server_name starkid.antoninomiccio.com;

    server_tokens off;

    # Log propri: servono a fail2ban e tengono StarKid fuori dai log degli
    # altri dodici siti.
    access_log /var/log/starkid/access.log;
    error_log  /var/log/starkid/error.log warn;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/starkid.antoninomiccio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starkid.antoninomiccio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:ssl_starkid:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Niente stapling: richiede un resolver nel blocco http e non vale il
    # rischio di toccare la configurazione comune.

    # --- Intestazioni di sicurezza ---
    # HSTS senza includeSubDomains e senza preload: sul dominio ci sono altri
    # host, e un preload sbagliato non si disfa piu.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Il QR di provisioning si genera nel browser: serve una libreria servita
    # da qui ('self') piu il canvas e le immagini data:. Nient'altro esce.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    # NB: un add_header dentro una location cancella tutti quelli di sopra.
    # Nelle location qui sotto non ce ne sono, di proposito.

    # --- Limiti di taglia: l'API scambia JSON piccoli ---
    client_max_body_size 64k;
    client_body_buffer_size 16k;
    limit_conn starkid_conn 20;
    limit_req_status 429;
    limit_conn_status 429;
    # A livello warn il rifiuto finisce in error.log di StarKid. La jail
    # nginx-limit-req gia presente legge /var/log/nginx/error.log, non questo:
    # per farglielo vedere va aggiunto il percorso a quella jail (vedi README,
    # e' una modifica a una jail esistente, da fare a mano e di proposito).
    limit_req_log_level warn;

    # --- Proxy: definito una volta qui, le location lo ereditano ---
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    proxy_buffering on;
    proxy_buffers 8 8k;
    proxy_busy_buffers_size 16k;
    proxy_redirect off;
    # Cintura e bretelle sul cookie di sessione, qualunque cosa faccia l'app.
    # Il cookie va NOMINATO: con la "~" vuota la regola prendeva ogni cookie,
    # quindi anche starkid_csrf, che l'app imposta leggibile dalla pagina
    # perche e il suo scopo. Con httponly addosso, la web UI non trova il
    # token e ogni scrittura prende 403 senza che dal browser si capisca.
    proxy_cookie_flags starkid_sessione secure httponly samesite=strict;

    # --- Statici: serviti da nginx, non passano dal server Python ---
    root /opt/starkid/static;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|mjs|svg|png|webp|ico|woff2)$ {
        expires 1h;
        access_log off;
        try_files $uri =404;
    }

    # --- ACME anche qui: certbot in webroot puo essere raggiunto dopo un
    #     rimando, e deve restare senza autenticazione. ---
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        allow all;
        default_type "text/plain";
        root /var/www/starkid.antoninomiccio.com/html;
        try_files $uri =404;
    }

    # --- API dei dispositivi: i tablet si autenticano col loro Bearer token,
    #     mai con auth_basic. Se un domani comparisse un auth_basic ereditato
    #     dalla configurazione comune, qui dentro resta spento: altrimenti si
    #     fermerebbero tutti i tablet insieme. ---
    location ^~ /api/v1/device/ {
        auth_basic off;
        limit_req zone=starkid_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8082;
    }

    # --- Accesso alla web UI: limite stretto, e la porta d'ingresso ---
    location = /api/v1/auth/login {
        limit_req zone=starkid_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8082;
    }

    # --- Resto dell'API (web UI, sessione a cookie) ---
    location ^~ /api/ {
        limit_req zone=starkid_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8082;
    }

    # --- Sonda per il monitor esterno: senza autenticazione, come da contratto ---
    location = /healthz {
        auth_basic off;
        access_log off;
        limit_req zone=starkid_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8082;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
    location = /robots.txt  { access_log off; log_not_found off; return 200 "User-agent: *\nDisallow: /\n"; }
}
