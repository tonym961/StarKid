# StarKid - jail per i tentativi di accesso falliti alla web UI
# Destinazione: /etc/fail2ban/jail.d/starkid.conf
#
# ============================================================================
# NON SI COPIA A MANO: lo fa deploy/attiva-fail2ban.sh
#
#     sudo ./deploy/attiva-fail2ban.sh --check      guarda e si ferma
#     sudo ./deploy/attiva-fail2ban.sh              attiva davvero
#     sudo ./deploy/attiva-fail2ban.sh --disattiva  torna indietro
#
# install.sh non tocca fail2ban: e un servizio di tutta la macchina, non
# nostro. Qui dentro enabled = false e resta false, cosi questo file da solo
# non accende niente: "enabled = true" lo scrive lo script, nella copia in
# /etc/fail2ban/jail.d/, DOPO aver verificato che il log esista, che il filtro
# regga sulle righe vere e che "fail2ban-client -t" passi - e dopo il reload
# ricontrolla che le jail che c'erano prima ci siano ancora, sshd compresa,
# tornando indietro da solo se non e cosi.
#
# Le tre verifiche stanno nello script perche sono quelle che contano: con un
# logpath che non esiste il server fail2ban non riparte piu e si porta dietro
# anche le quattro jail che oggi funzionano.
#
# A mano restano solo le due cose che vanno guardate da una persona:
#     sudo fail2ban-client status starkid-auth
#     sudo fail2ban-client set starkid-auth unbanip IL.TUO.INDI.RIZZO
# ============================================================================

[starkid-auth]
enabled  = false

filter   = starkid-auth
logpath  = /var/log/starkid/access.log
# Lettura a file, dichiarata: su questa macchina il default di jail.conf
# potrebbe essere systemd, e con quello il logpath verrebbe ignorato.
backend  = polling
port     = http,https
protocol = tcp

# Un inquilino solo e un account solo: cinque errori in dieci minuti sono gia
# tanti.
maxretry = 5
findtime = 10m
bantime  = 1h
# Chi insiste resta fuori sempre piu a lungo, fino a un giorno.
bantime.increment = true
bantime.maxtime   = 1d

# Azione standard di questa macchina (la stessa delle jail nginx-* esistenti).
action = %(action_)s

# L'ignoreip NON si scrive qui: lo aggiunge in coda attiva-fail2ban.sh, che
# mette sempre almeno localhost e ci aggiunge quello che gli passi:
#     sudo ./deploy/attiva-fail2ban.sh --ignoreip "1.2.3.4"
# Senza, cinque password sbagliate sono un'ora fuori anche per chi amministra,
# e si rientra da SSH con "unbanip". Con un indirizzo di casa che cambia, una
# eccezione scritta qui invecchia male: meglio niente e sapere l'unbanip.
