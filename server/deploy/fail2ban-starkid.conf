# StarKid - jail per i tentativi di accesso falliti alla web UI
# Destinazione: /etc/fail2ban/jail.d/starkid.conf
#
# ============================================================================
# DA PROPORRE, NON DA ATTIVARE.
# install.sh NON copia questo file. Qui dentro enabled = false di proposito:
# anche dopo averlo copiato, la jail resta spenta finche non si mette
# enabled = true a mano, e solo dopo aver fatto le due cose qui sotto.
# ============================================================================
#
# PRIMA di attivarla:
#
# 1) il log deve esistere, cioe il vhost deve essere attivo e avere ricevuto
#    almeno una richiesta:
#       ls -l /var/log/starkid/access.log
#    Se il file non c'e, fail2ban non parte piu e si portano dietro anche le
#    quattro jail che funzionano adesso (sshd compresa).
#
# 2) il filtro va provato su righe vere, senza attivare niente:
#       fail2ban-regex /var/log/starkid/access.log \
#                      /etc/fail2ban/filter.d/starkid-auth.conf
#    Deve contare i POST a /api/v1/auth/login finiti in 401 e nient'altro.
#
# 3) decidere se mettere il proprio indirizzo in ignoreip: una password
#    sbagliata cinque volte e un blocco di un'ora sulla stessa macchina da
#    cui si amministra.
#
# Dopo:  fail2ban-client reload  (non restart: un restart azzera i blocchi
#        in corso delle altre jail)
#        fail2ban-client status starkid-auth

[starkid-auth]
enabled  = false

filter   = starkid-auth
logpath  = /var/log/starkid/access.log
# Lettura a file, dichiarata: su questa macchina il default di jail.conf
# potrebbe essere systemd, e con quello il logpath verrebbe ignorato.
backend  = polling
port     = http,https
protocol = tcp

# Un inquilino solo e un account solo: cinque errori in dieci minuti sono gia
# tanti.
maxretry = 5
findtime = 10m
bantime  = 1h
# Chi insiste resta fuori sempre piu a lungo, fino a un giorno.
bantime.increment = true
bantime.maxtime   = 1d

# Azione standard di questa macchina (la stessa delle jail nginx-* esistenti).
action = %(action_)s

# Il proprio indirizzo, per non chiudersi fuori. Da scommentare e compilare.
# ignoreip = 127.0.0.1/8 ::1 1.2.3.4
