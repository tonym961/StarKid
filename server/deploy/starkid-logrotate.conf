# StarKid - rotazione dei propri log di nginx.
# Destinazione: /etc/logrotate.d/starkid
#
# Perche i log stanno in /var/log/starkid/ e non in /var/log/nginx/: il
# logrotate di nginx prende /var/log/nginx/*.log, quindi avrebbe preso anche i
# nostri, e due file di logrotate che elencano lo stesso percorso fanno
# "duplicate log entry" e il secondo viene saltato in silenzio. In una
# cartella nostra nessuno litiga e il tetto qui sotto vale davvero.
#
# Il tetto serve: ogni richiesta rifiutata da limit_req scrive DUE righe (una
# 429 nell'access e un warn nell'error), circa 450 byte. Con "nodelay" il
# rifiuto non costa niente a chi lo riceve, quindi un flusso si regge a lungo:
# a 2000 richieste al secondo si scrive quasi 1 MB al secondo. Su un disco da
# 32 GB condiviso con altri undici siti, la rotazione giornaliera senza
# maxsize non basta - fra due rotazioni non c'e nessun limite, e il disco
# pieno ferma nginx, journald e fail2ban per tutti, non solo per StarKid.
/var/log/starkid/*.log {
    daily
    maxsize 100M
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        [ -f /run/nginx.pid ] && kill -USR1 "$(cat /run/nginx.pid)" || true
    endscript
}
