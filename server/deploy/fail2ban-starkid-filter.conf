# StarKid - filtro per i tentativi di accesso falliti alla web UI
# Destinazione: /etc/fail2ban/filter.d/starkid-auth.conf
#
# DA PROPORRE, NON DA ATTIVARE: install.sh non lo installa. Lo si copia a mano
# dopo averlo provato (vedi README, sezione fail2ban).
#
# Legge il log di accesso di nginx del solo vhost StarKid, non il journal del
# servizio Python: dietro al proxy il server vede sempre 127.0.0.1, mentre
# nginx scrive l'indirizzo vero del client.
#
# Formato atteso: il "combined" di Debian, cioe
#   1.2.3.4 - - [31/Oct/2026:04:17:00 +0100] "POST /api/v1/auth/login HTTP/1.1" 401 33 "-" "..."
# La parentesi quadra e scritta in modo da combaciare sia con la data dentro
# sia vuota, perche fail2ban puo togliere il timestamp prima di applicare la
# regola.

[INCLUDES]
before = common.conf

[Definition]

failregex = ^<HOST> - \S+ \[[^\]]*\] "POST /api/v1/auth/login HTTP/[0-9.]+" (?:401|403|422|429)\s

ignoreregex =

# La data di nginx in prima posizione dopo l'indirizzo.
datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}

[Init]
# Una riga di quel log non arriva mai a 8k.
maxlines = 1
journalmatch =
